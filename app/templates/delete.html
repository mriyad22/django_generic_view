<!DOCTYPE html>
<html>
<head>
    <title>Delete Job</title>
</head>

<body>

<h1>Delete Job</h1>

<p>
    Are you sure you want to delete
    <strong>{{ object.name }}</strong>?
</p>


<form method="POST">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<br>

<a href="{% url 'detail' object.pk %}">
    Cancel
</a>

</body>
</html>
