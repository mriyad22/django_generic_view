<!DOCTYPE html>
<html>
<head>
    <title>Job Form</title>
</head>

<body>

{% if object %}
    <h1>Edit Student</h1>
{% else %}
    <h1>Create Student</h1>
{% endif %}


<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Save
    </button>

</form>

<br>

<a href="{% url 'list' %}">
    Cancel
</a>

</body>
</html>
